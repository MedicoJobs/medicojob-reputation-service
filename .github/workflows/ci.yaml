name: reputation-service CI Pipeline

on:
  push:
    branches:
      - feature-branch
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read

jobs:
  pipeline:
    if: ${{ github.event.pull_request.merged != true }}
    uses: ./.github/workflows/ci_service_pipeline.yml
    with:
      service_name: reputation-service
      service_path: .
      sonar_project_key: medicojob-reputation-service
      sonar_token_secret_name: SONAR_TOKEN
    secrets: inherit
